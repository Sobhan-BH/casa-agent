services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casa
      POSTGRES_PASSWORD: casa
      POSTGRES_DB: casa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casa"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - casa-db:/var/lib/postgresql/data

  api:
    build: .
    environment:
      CASA_ENV: development
      CASA_DATABASE_URL: postgresql+psycopg://casa:casa@db:5432/casa
      CASA_LLM_PROVIDER: heuristic
      CASA_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # The API process also runs the inline worker (MVP queue backend).

  lab:
    build: ./lab
    ports:
      - "8001:8001"

volumes:
  casa-db:
